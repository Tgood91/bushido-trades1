    <script>
      // Gracefully catch and suppress benign Vite HMR websocket rejections in sandboxed iframe previews
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          console.debug('[HMR Monitor] Benign sandbox WebSocket rejection suppressed:', msg);
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || String(event))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
